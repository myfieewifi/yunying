name: Build YunYing Android

on:
  workflow_dispatch:     # 手动触发
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml']
    tags: ['v*']

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Download libmpv AAR
        run: bash android/scripts/download-mpv.sh

      # okhttp-android 5.4.0 要求 compileSdk 36；runner 预装若无 android-36 则显式补装（找不到时容忍，Gradle 报错更可读）
      - name: Ensure Android SDK platform 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --list 2>/dev/null | grep -o 'platforms;android-36' || true
          ls "$ANDROID_HOME/platforms"
          "$SDKM" --install "platforms;android-36" 2>&1 || true
          ls "$ANDROID_HOME/platforms" || true

      - name: Build APK (Release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YunYing-Android-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/*.apk
