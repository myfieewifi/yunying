name: Build YunYing Android

on:
  workflow_dispatch:     # 手动触发
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml']
    tags: ['v*']

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Download libmpv AAR
        run: bash android/scripts/download-mpv.sh

      # AGP 8.5.2 不会自动补装 compileSdk 37 的平台包（okhttp-android 5.5.0 元数据硬性要求），
      # runner 预装 SDK 只到 android-3x 旧版，显式安装一次
      - name: Install Android SDK platform 37
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-37" > /dev/null
          ls "$ANDROID_HOME/platforms" | grep -i 37

      - name: Build APK (Release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YunYing-Android-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/*.apk
