name: Build YunYing HarmonyOS

on:
  workflow_dispatch:     # 手动触发
  push:
    branches: [main]
    paths: ['harmonyos/**', '.github/workflows/build-harmony.yml']
    tags: ['v*']

jobs:
  build-harmonyos:
    name: Build HarmonyOS HAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # libGL1：SDK 纹理压缩工具依赖（Linux）
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      # 从 ErBWs/ohos-sdk 公共镜像下载 DevEco Command Line Tools（含 SDK + hvigor + ohpm + node）
      - name: Setup HarmonyOS CLI tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: 6.1.1.280
          cache: true

      # @ohos/hvigor 仅发布在 repo.harmonyos.com（华为云镜像无该包，packument 404）
      - name: Configure registries
        run: |
          echo "@ohos:registry=https://repo.harmonyos.com/npm/" > ~/.npmrc
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/ || true
          ohpm config set strict_ssl false || true

      - name: Show toolchain
        run: |
          node -v
          ohpm -v || true
          hvigorw -v || true

      - name: Install ohpm dependencies
        working-directory: harmonyos
        run: ohpm install --all || echo "no ohpm dependencies"

      - name: Build HAP (unsigned)
        working-directory: harmonyos
        run: |
          hvigorw assembleHap --mode module -p product=default -p buildMode=release --no-daemon --stacktrace

      - name: Upload HAP
        uses: actions/upload-artifact@v4
        with:
          name: yunying-harmonyos-hap-${{ github.run_id }}
          path: harmonyos/entry/build/default/outputs/**/*.hap
          if-no-files-found: error
          retention-days: 7
